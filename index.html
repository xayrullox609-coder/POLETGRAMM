<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poletgram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--t-pbg,#e4eefb);color:var(--tx,var(--t-on,#0f1f3a));max-width:520px;margin:auto;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#app{padding:calc(10px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 12px 96px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.pill{display:flex;align-items:center;gap:9.1px;background:rgba(255,255,255,.85);border-radius:25.8px;padding:5.3px 7.6px 5.3px 6.1px;width:max-content;margin:0 auto 15.2px;box-shadow:0 4.6px 13.7px rgba(var(--t-sh-rgb,91,143,208),0.13)}
.av{width:33.4px;height:33.4px;border-radius:50%;background:linear-gradient(135deg,var(--t-a1,#5bb4ff),var(--t-a2,#1f7bff));overflow:hidden;border:2.3px solid var(--t-a1,#4aa3ff);box-shadow:0 0 0 2.3px var(--t-b1,#bcd8fa);display:grid;place-items:center;flex:none;position:relative}
.av b{font-size:16.7px;font-weight:900;color:#fff;line-height:1}
.av i{position:absolute;bottom:25%;font-style:normal;font-size:3.8px;color:#e8c35a;font-weight:700;letter-spacing:.3px}
.bal{background:var(--t-s1,#dcebff);border:1.5px solid var(--t-b2,#9cc6f7);border-radius:16.7px;padding:3.8px 10.6px;font-weight:700;font-size:12.9px}
.pill>b{font-size:12.9px;font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 3px 10.6px}
.sec h2{font-size:16.7px;font-weight:800}
.sec span{background:var(--t-s2,#d6e7fc);color:var(--t-a1,#4aa3ff);font-weight:600;font-size:11.4px;border-radius:10.6px;padding:3.8px 10.6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15.2px}
.pc{background:var(--card-bg,#fff);border-radius:var(--card-r,22.8px);padding:15.2px 12.2px 13.7px;text-align:left;box-shadow:0 4.6px 15.2px rgba(var(--t-sh-rgb,91,143,208),0.11)}
.lg{width:33.4px;height:33.4px;border-radius:10.6px;display:grid;place-items:center;margin-bottom:9.1px}
.lg svg{width:30.4px;height:30.4px}
.pc b{display:block;font-size:14.4px;font-weight:800}
.pc small{display:block;color:var(--t-tx2,#566a85);font-size:10.6px;margin:2px 0 10.6px;font-weight:400}
.st{display:inline-block;font-size:9.9px;font-weight:700;border-radius:10.6px;padding:3px 10.6px;border:1.5px solid}
.g{color:#1a9a76;background:#e1f7ef;border-color:#a6e6d2}.bl{color:#1b9bd7;background:#e3f4fd;border-color:#a5daf3}.rd{color:var(--t-a2,#2a6fd6);background:var(--t-s3,#e0ecff);border-color:var(--t-b2,#a6c6f5)}
.row{background:var(--card-bg,#fff);border-radius:var(--card-r,21.3px);padding:10.6px 10.6px 10.6px 10.6px;margin-bottom:12.2px;display:flex;align-items:center;gap:10.6px;box-shadow:0 3px 12.2px rgba(var(--t-sh-rgb,91,143,208),0.09);border:1px solid var(--t-s2,#d6e7fc);width:100%;text-align:left}
.ic{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font-size:17.5px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:12.9px;font-weight:800;line-height:1.15}.grow small{display:block;color:var(--t-tx2,#566a85);font-size:10.6px;margin-top:2.3px;line-height:1.2}
.tag{border:1.5px solid #1a9a76;color:#17384a;background:#e1f7ef;border-radius:12.2px;padding:2.3px 7.6px;font-weight:700;font-size:11.4px;white-space:nowrap}
.btn{background:var(--btn-bg,linear-gradient(90deg,var(--t-a1,#4aa3ff),var(--t-a2,#1f7bff)));color:var(--btn-fg,#fff);font-weight:700;font-size:12.2px;border-radius:var(--btn-r,16.7px);padding:8.4px 14.4px;box-shadow:0 3.8px 9.1px rgba(var(--t-a2-rgb,31,123,255),0.27);zoom:var(--btn-z,1)}
.btn:disabled{opacity:.55}
.bn{align-items:center}.bn .grow{display:flex;flex-direction:column;align-items:flex-start;padding-left:4.6px}
.bn .grow b{font-size:19.8px;font-weight:400;letter-spacing:.2px;margin-bottom:3px}
.hero{background:rgba(255,255,255,.92);border-radius:24.3px;padding:15.2px 13.7px;display:flex;gap:13.7px;align-items:center;margin-bottom:13.7px;box-shadow:0 4.6px 15.2px rgba(var(--t-sh-rgb,91,143,208),0.11);position:relative}
.hero .av{width:68.4px;height:68.4px;border-width:3px;box-shadow:0 0 0 3.8px var(--t-b1,#bcd8fa),0 0 0 6.1px var(--t-s3,#e6f1ff)}
.hero .av b{font-size:33.4px}.hero .av i{font-size:6.8px;bottom:26%}
.hero strong{font-size:13.7px;font-weight:800;display:block;margin-bottom:4.6px}
.big{font-size:28.9px;font-weight:800;line-height:1}.big small{font-size:11.4px;font-weight:500;color:var(--t-tx3,#3f5470);margin-left:6.1px}
.gl{position:absolute;top:13.7px;right:13.7px;font-size:22.8px}
.mi{border-radius:15.2px;display:grid;place-items:center;width:45.6px;height:45.6px;flex:none;color:#fff;box-shadow:0 3.8px 9.1px #0002}
.mi svg{width:22.8px;height:22.8px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ar{color:var(--t-a3,#3b93ff);font-size:16.7px;font-weight:700}
.m .grow b{font-size:14.4px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));background:#fff;border-radius:25.8px;display:flex;padding:6.1px;box-shadow:0 6.1px 19.8px rgba(var(--t-sh-rgb,91,143,208),0.20)}
nav button{flex:1;background:none;color:var(--t-ni,#8aa6cc);padding:6.8px 0 6.1px;border-radius:21.3px;font-size:10.6px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2.3px}
nav button svg{width:19.8px;height:19.8px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--t-s1,#dcebff);color:var(--t-tx,#0f1f3a)}nav button.on svg{color:var(--t-a3,#3b93ff)}
.sheet{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:#fff;width:100%;max-width:520px;border-radius:22.8px 22.8px 0 0;padding:16.7px 13.7px calc(26px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:15.2px;font-weight:800;margin-bottom:6.1px}
input{width:100%;font:inherit;padding:9.9px 11.4px;border-radius:12.2px;border:1.5px solid var(--t-b1,#bcd8fa);background:var(--t-s4,#f4f9ff);color:var(--t-tx,#0f1f3a);margin:4.6px 0;outline:0}
.back{background:none;color:var(--t-a2,#1f7bff);font-weight:700;margin:0 3px 9.1px;font-size:12.2px}
.lb{display:flex;gap:7.6px;align-items:center;padding:6.8px 0;border-bottom:1px solid var(--t-s2,#d6e7fc)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--t-tx,#0f1f3a);color:#fff;padding:7.6px 13.7px;border-radius:15.2px;font-weight:600;z-index:9;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.card{background:#fff;border-radius:20px;padding:12px;margin-bottom:12px;box-shadow:0 3px 12px rgba(var(--t-sh-rgb,91,143,208),0.09);border:1px solid var(--t-s2,#d6e7fc)}.card h3{font-size:14px;margin-bottom:6px}.card small{display:block;color:var(--t-tx2,#566a85);font-size:11px;word-break:break-all}.card input,.card select,.card textarea{width:100%;font:inherit;font-size:13px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--t-b1,#bcd8fa);background:var(--t-s4,#f4f9ff);color:var(--t-tx,#0f1f3a);margin:4px 0;outline:0}.card .w{width:100%;margin-top:6px;padding:9px;font-size:13px}.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--t-s2,#d6e7fc)}.li b{font-size:12.5px;display:block}.mini{background:var(--t-s1,#dcebff);color:var(--t-a2,#1f7bff);border-radius:10px;padding:5px 9px;font-weight:800}.mini.ok{background:#e1f7ef;color:#1a9a76}

.bkp{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px 12px;font-weight:600;font-size:11.5px;box-shadow:0 3px 9px rgba(var(--t-sh-rgb,91,143,208),0.13);flex:none}.hint{color:var(--t-on2,var(--t-tx2,#566a85));font-size:12.5px;margin:0 4px 11px}.si{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:0 4px 9px #0002}.si svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.soon{opacity:.55}.soonb{font-style:normal;background:var(--t-s2,#cfe0f7);color:var(--t-a2,#3f6fb0);border-radius:9px;padding:2px 7px;font-size:9px;margin-left:6px;font-weight:700;vertical-align:middle}.sec h2{font-size:16px}

</style></head><body>
<div id="bg"></div>
<div id="app"></div><div id="toast"></div>
<script>
const IG='<svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3"/><circle cx="20" cy="20" r="6" fill="none" stroke="#fff" stroke-width="3"/><circle cx="28" cy="12" r="1.8" fill="#fff"/></svg>';
const TG='<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#fff"/><path d="M10 19.5L29 12l-4 17-6-4.8-3 2.8v-4.8z" fill="#0a8bd6"/></svg>';
const TT='<svg viewBox="0 0 40 40"><path d="M22 9v14a4.5 4.5 0 1 1-4.5-4.5M22 9c.6 3.6 3 5.6 6.5 5.8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>';
const YT='<svg viewBox="0 0 40 40"><rect x="5" y="10" width="30" height="20" rx="7" fill="#fff"/><path d="M17 15l9 5-9 5z" fill="#f00"/></svg>';
const EMPTY=`<div class="card"><small>Hozircha xizmatlar yo'q</small></div>`;
const RAIL=["Instagram","Telegram","YouTube","TikTok"];
const STY={
 Instagram:{ic:IG,bg:"linear-gradient(135deg,#f9a03c,#e1306c,#8a3ab9)",sub:"Prasmotr, Like, Share",tag:"AKTIV",cl:"g"},
 Telegram:{ic:TG,bg:"#0a8bd6",sub:"Prasmotr & Reaksiya",tag:"TEZKOR",cl:"bl"},
 YouTube:{ic:YT,bg:"#f00",sub:"Prasmotr, Like, Obunachi",tag:"YANGI",cl:"rd"},
 TikTok:{ic:TT,bg:"linear-gradient(135deg,#19e6d6,#0b3b45 55%,#f0457f)",sub:"Video Rivoj",tag:"TREND",cl:"rd"}
};
const tg=window.Telegram&&Telegram.WebApp;
try{if(tg){tg.ready();tg.expand();try{if(tg.isFullscreen&&tg.exitFullscreen)tg.exitFullscreen()}catch(e){}tg.setHeaderColor("#cfe3fb");tg.setBackgroundColor("#e4eefb");tg.setBottomBarColor("#e4eefb")}}catch(e){}
const BOT="Poletgram_bot";
let S={tab:"boost",plat:null,me:{id:0,name:"",balance:0},tasks:[],svc:{},ref:20,ui:{},pkgs:[],prev:"boost",theme:{},bgv:"",pvbg:null,resetAt:0},ST={},CD={};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=(k,d)=>esc((S.ui[k]&&S.ui[k].label)||d);
const money=n=>(+n).toFixed(2)+" $";
const num=n=>+(+n).toFixed(2);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2400)}
async function api(p,b){
 try{const r=await fetch("/api/"+p,{method:"POST",headers:{"Content-Type":"application/json","X-Init":tg?tg.initData:""},body:JSON.stringify(b||{})});
  const j=await r.json();if(!r.ok)throw new Error(j.error||"Xatolik");return j}
 catch(e){toast(e.message);throw e}}
async function load(){const d=await api("init");S.me=d.me;S.tasks=d.tasks;S.tasks.forEach(t=>{if(t.cd>0)CD[t.id]=Date.now()+t.cd*1000});S.svc=d.svc;S.ref=d.ref;S.admin=d.admin;S.ui=d.ui||{};S.pkgs=d.pkgs||[];S.theme=d.theme||{};S.bgv=d.bgv||"";S.pvbg=null;S.resetAt=Date.now()+(d.reset_in||0)*1000;render()}
const PH=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.photo_url)||"";
const ini=()=>((S.me.name||"?").replace("@","").charAt(0)||"?").toUpperCase();
const AV=x=>`<div class="av"><b>${esc(ini())}</b>${PH?`<img src="${esc(PH)}" referrerpolicy="no-referrer" alt="" onerror="this.remove()">`:""}</div>`;
function pill(){return `<div class="pill">${AV()}<b>${esc(S.me.name)}</b><span class="bal" data-k="pill_bal">${money(S.me.balance)}</span><button class="plus" data-k="pill_plus" onclick="if(S.tab!='topup')S.prev=S.tab;S.tab='topup';render();scrollTo(0,0)">+</button></div>`}
const SI={play:'<path d="M8 5l11 7-11 7z" fill="#fff" stroke="none"/>',share:'<circle cx="6" cy="12" r="2.6"/><circle cx="17" cy="6" r="2.6"/><circle cx="17" cy="18" r="2.6"/><path d="M8.3 10.8l6.4-3.6M8.3 13.2l6.4 3.6"/>',heart:'<path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z" fill="#fff" stroke="none"/>',save:'<path d="M6 4h12v17l-6-4-6 4z"/>',user:'<circle cx="9" cy="8" r="3.3"/><path d="M3 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5M18 8v6M15 11h6"/>'};
function boost(){
 if(S.plat){const p=STY[S.plat];return pill()+`<div class="sec" style="justify-content:flex-start;gap:10px"><button class="bkp" onclick="S.plat=null;render()">← Orqaga</button><h2>❄️ ${S.plat} Xizmatlari</h2></div><p class="hint">${S.plat} xizmat turini tanlang:</p>`+
  S.svc[S.plat].map((it,i)=>`<button class="row svc${it[5]?" soon":""}" data-k="svc_row" ${it[5]?"disabled":`onclick="order(${i})"`}><div class="si" style="background:${p.bg}"><svg viewBox="0 0 24 24">${SI[it[4]]}</svg></div><div class="grow"><b>${esc(it[0])}${it[5]?'<em class="soonb">Tez kunda</em>':""}</b><small>${esc(it[2])} • Min: ${it[3]}</small></div>${it[5]?"":`<span class="tag" style="font-size:10px">${num(it[1])} $ / ${it[6]} ta</span>`}<span class="ar">→</span></button>`).join("")||EMPTY}
 return pill()+`<div class="sec"><h2>${L("t_services","Xizmatlar")}</h2><span data-k="t_badge">${L("t_badge","Tezkor & Kafolatli")}</span></div><div class="grid">`+Object.entries(STY).sort((a,b)=>ordOf("p_"+a[0])-ordOf("p_"+b[0])).map(([n,p])=>`<button class="pc" data-k="p_${n}" onclick="S.plat='${n}';render()"><div class="lg" style="background:${p.bg}">${p.ic}</div><b>${L("p_"+n,n)}</b><small>${p.sub}</small><span class="st ${p.cl}">${p.tag}</span></button>`).join("")+`</div>`}
function order(i){const n=S.plat,it=S.svc[n][i];
 sheet(`<h2>${n} · ${esc(it[0])}</h2><p style="color:var(--t-tx2,#566a85);margin:2px 0 6px;font-size:12px">${esc(it[2])}. Narx: ${num(it[1])} $ / ${it[6]} ta · Min: ${it[3]}</p><input id="lk" placeholder="Havolani kiriting"><input id="qt" type="number" min="${it[3]}" value="${Math.max(it[3],it[6])}" oninput="cost(${i})"><p id="cs" style="margin:6px 0 12px;font-weight:700"></p><button class="btn" style="width:100%" onclick="buy(${i})">Buyurtma berish</button>`);cost(i)}
function cost(i){const q=+$("#qt").value||0;$("#cs").textContent="Narx: "+money(q/S.svc[S.plat][i][6]*S.svc[S.plat][i][1])}
async function buy(i){const q=+$("#qt").value||0,c=q/S.svc[S.plat][i][6]*S.svc[S.plat][i][1];
 if(!$("#lk").value.trim())return toast("Havolani kiriting");if(q<S.svc[S.plat][i][3])return toast("Minimal miqdor: "+S.svc[S.plat][i][3]);if(c>S.me.balance)return toast("Balans yetarli emas");
 const r=await api("order",{platform:S.plat,sid:S.svc[S.plat][i][7],link:$("#lk").value.trim(),qty:q});S.me=r.me;closeSheet();toast("Buyurtma qabul qilindi ✓");render()}
function sheet(h){closeSheet();const d=document.createElement("div");d.className="sheet";d.id="sh";d.onclick=e=>{if(e.target===d)closeSheet()};d.innerHTML="<div>"+h+"</div>";document.body.appendChild(d)}
function closeSheet(){const s=$("#sh");if(s)s.remove()}
const TI={link:["#1fa84f","🔗"],youtube:["#e53935","▶"],ad:["#dbeaf6","📺"],bot:["#d9ecfb","🤖"],bonus:["#dcebff","🎁"]};
const BT={link:"Ochish",youtube:"Ochish",ad:"Ko'rish",bot:"Start",bonus:"Bajarish"};
function leftTxt(){const m=Math.ceil(Math.max(0,S.resetAt-Date.now())/60000),h=Math.floor(m/60),mm=m%60;return h?`${h} soat ${mm} daq`:`${mm} daq`}
function tasks(){
 const rows=S.tasks.map(t=>{const x=TI[t.type]||TI.link,lab=t.done?L("tb_done","Bajarildi"):ST[t.id]?L("tb_check","Tekshirish"):L("tb_"+t.type,BT[t.type]||"Ochish");
  const ex=t.daily>0&&t.cnt>=t.daily,cdl=CD[t.id]>Date.now()?Math.ceil((CD[t.id]-Date.now())/1000):0,btn=ex?`<span class="tl">⏳ ${leftTxt()}</span>`:cdl?`<button class="btn" data-k="tb_${t.type}" disabled>${cdl}</button>`:`<button class="btn" data-k="tb_${t.type}" ${t.done?"disabled":""} onclick="tap(${t.id})">${lab}</button>`,tag=`<span class="tag">+${num(t.reward)} $</span>`;
  if(t.type=="bonus")return `<div class="row bn"><div class="ic" style="background:conic-gradient(#ff3d9a,#ffb300,#2ee6a6,#3d7bff,#b53dff,#ff3d9a);color:#fff;font-size:15px;width:41px;height:41px">⫶</div><div class="grow"><b>${esc(t.title)}</b>${tag}</div>${btn}</div>`;
  return `<div class="row"><div class="ic" style="background:${x[0]};${t.type=="youtube"?"border-radius:12px;color:#fff;font-size:15px":""}">${x[1]}</div><div class="grow"><b>${esc(t.title)}</b><small>${esc(t.sub)}${t.daily?`${t.sub?" • ":""}Bugun: ${t.cnt}/${t.daily}`:""}</small></div>${tag}${btn}</div>`}).join("")
 ||`<div class="row"><div class="grow"><b>Hozircha vazifalar yo'q</b><small>Tez orada yangi vazifalar qo'shiladi</small></div></div>`;
 return pill()+`<div class="sec"><h2>${L("t_tasks","Vazifalar Ro'yxati")}</h2></div>`+rows+
 `<div class="row"><div class="ic" style="background:#d9f2f2">👥</div><div class="grow"><b>Do'st Taklif Qilish</b><small>Har bir faol do'stingiz uchun</small></div><span class="tag">+${num(S.ref)} $</span><button class="btn" data-k="b_invite" onclick="invite()">${L("b_invite","Taklif")}</button></div>`}
function go(u){if(!u)return;if(tg&&/^https:\/\/t\.me\//.test(u))tg.openTelegramLink(u);else if(tg)tg.openLink(u);else window.open(u,"_blank")}
async function tap(id){
 const t=S.tasks.find(x=>x.id==id);if(!t||t.done)return;
 if(t.type!="bonus"&&!ST[id]){const r=await api("task/start",{id});ST[id]=Date.now();go(r.url);render();return}
 if(t.type!="bonus"&&Date.now()-ST[id]<10000)return toast("Vazifani bajaring, kamida 10 soniya kuting");
 const r=await api("task/claim",{id});S.me=r.me;t.cnt=(t.cnt||0)+1;t.done=t.daily?t.cnt>=t.daily:true;delete ST[id];if(t.type=="ad")CD[id]=Date.now()+5000;toast("+"+num(t.reward)+" $");render()}
function invite(){const l=`https://t.me/${BOT}?start=ref_${S.me.id}`;
 S.sh=`https://t.me/share/url?url=${encodeURIComponent(l)}&text=${encodeURIComponent("Poletgram — vazifa bajarib pul yig'ing 💸").replace(/'/g,"%27")}`;
 sheet(`<h2>Do'st Taklif Qilish</h2><p style="color:var(--t-tx2,#566a85);margin:4px 0">Har bir faol do'stingiz uchun +${num(S.ref)} $</p><p style="margin:2px 0 8px;font-weight:700">Taklif qilganlar: ${S.me.refs||0} · Faol: ${S.me.active||0}</p><input readonly id="rl" value="${l}" onclick="this.select()"><button class="btn" style="width:100%;margin-top:8px" onclick="go(S.sh)">Ulashish</button><button class="btn" style="width:100%;margin-top:8px;background:var(--t-s1,#dcebff);color:var(--t-a2,#1f7bff);box-shadow:none" onclick="copyRef()">Nusxa olish</button>`)}
function copyRef(){const i=$("#rl");try{navigator.clipboard.writeText(i.value).then(()=>toast("Nusxa olindi ✓"))}catch(e){i.select();document.execCommand("copy");toast("Nusxa olindi ✓")}}
function profile(){
 const m=(k,bg,svg,t,sb,fn)=>`<button class="row m" data-k="${k}" onclick="${fn}"><div class="mi" style="background:${bg}"><svg viewBox="0 0 24 24">${svg}</svg></div><div class="grow"><b>${L(k,t)}</b><small>${sb}</small></div><span class="ar">→</span></button>`;
 const it=[["m_services","linear-gradient(135deg,var(--t-a1,#5bb4ff),var(--t-a2,#2f7fe8))",'<path d="M3 18h18l1-10-5 4-5-7-5 7-5-4z"/>',"Pullik Xizmatlar","SMM xizmatlari — obunachilar, layklar, prasmotr","S.pp='Instagram';S.tab='paid';render();scrollTo(0,0)"],
 ["m_send","linear-gradient(135deg,var(--t-a3,#22c3e6),var(--t-a2,#0f9fd0))",'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',"Pul Yuborish","Boshqa foydalanuvchiga dollar o'tkazish","send()"],
 ["m_contest","linear-gradient(135deg,var(--t-a2,#6a8dff),var(--t-tx2,#3f5fe0))",'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/>',"Musobaqa","Eng ko'p do'st taklif qilganlar va sovrinlar","contest()"],
 ["m_promo","linear-gradient(135deg,var(--t-a1,#4aa3ff),var(--t-a3,#1f6fe0))",'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',"Promokod","Promokod kiriting va bonuslarga ega bo'ling","promo()"]].sort((x,y)=>ordOf(x[0])-ordOf(y[0]));
 return `<div class="hero">${AV(1)}<div><strong>${esc(S.me.name)}</strong><div class="big">${money(S.me.balance)}<small>Dollar Balansi</small></div></div><span class="gl">🌐</span></div>`+it.map(x=>m(...x)).join("")+(S.admin?m("m_admin","linear-gradient(135deg,#6c63ff,#4a3fe0)",'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',"Admin panel","Vazifalar, promokod, xabar va buyurtmalar","openAdmin()"):"")}
function send(){sheet(`<h2>Pul Yuborish</h2><input id="u" placeholder="@username"><input id="a" type="number" step="0.01" placeholder="Summa ($)"><button class="btn" style="width:100%;margin-top:8px" onclick="doSend()">Yuborish</button>`)}
async function doSend(){const u=$("#u").value.trim(),a=+$("#a").value;if(!u)return toast("Username kiriting");if(!(a>0))return toast("Summani kiriting");if(a>S.me.balance)return toast("Balans yetarli emas");
 const r=await api("send",{to:u,amount:a});S.me=r.me;closeSheet();toast(money(a)+" yuborildi ✓");render()}
async function contest(){const d=await api("top");sheet(`<h2>Musobaqa</h2><p style="color:var(--t-tx2,#566a85);margin-bottom:8px">Eng ko'p do'st taklif qilganlar</p>`+(d.top.map((x,i)=>`<div class="lb"><b>${i+1}</b><span class="grow">${esc(x.n)}</span><b>${x.c} ta</b></div>`).join("")||"<p>Hozircha hech kim yo'q</p>")+`<button class="btn" style="width:100%;margin-top:14px" onclick="closeSheet()">Yopish</button>`)}
function promo(){sheet(`<h2>Promokod</h2><input id="pc" placeholder="Promokodni kiriting"><button class="btn" style="width:100%;margin-top:8px" onclick="doPromo()">Qo'llash</button>`)}
async function doPromo(){const c=$("#pc").value.trim();if(!c)return;const r=await api("promo",{code:c});S.me=r.me;closeSheet();toast("Promokod: +"+num(r.amount)+" $");render()}
const TN={link:"Havola",youtube:"YouTube",ad:"Reklama",bot:"Bot start",bonus:"Bonus"};
const v=id=>$("#"+id).value.trim();
async function openAdmin(){S.tab="admin";render();scrollTo(0,0);try{S.adm=(await api("admin/data")).data}catch(e){return}if(S.tab=="admin")render()}
async function adm(act,b,msg){const r=await api("admin/"+act,b||{});S.adm=r.data;toast(msg||"Bajarildi ✓");render()}
async function admL(act,b,msg){await adm(act,b,msg);await load()}
function admin(){const a=S.adm;if(!a)return `<button class="back" onclick="S.tab='profile';render()">← Orqaga</button><p style="padding:50px 0;text-align:center;font-weight:600">Yuklanmoqda…</p>`;const x=f=>`<button class="mini" onclick="${f}">✕</button>`;
 return `<button class="back" onclick="S.tab='profile';render()">← Orqaga</button><div class="sec"><h2>Admin panel</h2></div>
 <div class="card"><button class="mini ok" style="width:100%;padding:10px;font-size:13px" onclick="openUsers()">👥 Foydalanuvchilar: ${a.stats.users} →</button><b style="display:block;margin-top:8px">💰 ${a.stats.bal} $ &nbsp; 🛒 ${a.stats.orders}</b><small>Umumiy balans · buyurtmalar</small></div>
 <button class="btn" style="width:100%;margin-bottom:12px" onclick="S.tab='uied';render();scrollTo(0,0)">🎨 Tugmalarni tahrirlash</button>${svcCard(a)}
 <div class="card"><h3>Orqa fon rasmi va mavzu</h3><small>Rasm tanlang: ilovaning ranglari (tugmalar, kartalar, ramkalar, matn) rasm rangiga moslab avtomatik o'zgaradi.</small><input type="file" accept="image/*" id="bgf" onchange="bgPick(this)"><div id="bgprev"></div><button class="btn w" id="bgsave" disabled onclick="bgSave()">Saqlash va qo'llash</button><button class="mini" style="width:100%;margin-top:8px;padding:9px" onclick="bgReset()">Asl rasm va mavzuga qaytarish</button></div>
 <div class="card"><h3>Vazifalar</h3>${a.tasks.map(t=>`<div class="li"><div class="grow"><b>${esc(t.title)}</b><small>${TN[t.type]} · +${num(t.reward)} $ · ${t.daily?"kuniga "+t.daily+" marta":"bir martalik"} · ${esc(t.url)}</small></div>${x("admL('task_del',{id:"+t.id+"})")}</div>`).join("")||"<small>Vazifa yo'q</small>"}
 <select id="tt">${Object.entries(TN).map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select><input id="tti" placeholder="Sarlavha"><input id="tsu" placeholder="Tavsif"><input id="tur" placeholder="Havola (https://...)"><input id="trw" type="number" step="0.01" placeholder="Mukofot ($)"><input id="tdl" type="number" min="0" placeholder="Kuniga necha marta (0 = bir martalik)"><button class="btn w" onclick="admL('task_add',{type:v('tt'),title:v('tti'),sub:v('tsu'),url:v('tur'),reward:v('trw'),daily:v('tdl')})">Vazifa qo'shish</button></div>
 <div class="card"><h3>Promokodlar</h3><small>Yangi promokod qoʻshilganda @poletgram kanaliga rasm bilan avtomatik yuboriladi.</small>${a.promos.map(p=>`<div class="li"><div class="grow"><b>${esc(p.code)}</b><small>${num(p.amount)} $ · qoldi: ${p.uses}</small></div>${x("adm('promo_del',{code:'"+esc(p.code)+"'})")}</div>`).join("")||"<small>Promokod yo'q</small>"}
 <input id="pcd" placeholder="KOD"><input id="pam" type="number" step="0.01" placeholder="Summa ($)"><input id="pus" type="number" placeholder="Necha marta ishlatiladi"><button class="btn w" onclick="adm('promo_add',{code:v('pcd'),amount:v('pam'),uses:v('pus')},'Promokod saqlandi, kanalga yuborilmoqda ✓')">Promokod qo'shish</button></div>
 <div class="card"><h3>Do'st taklif mukofoti</h3><input id="rfa" type="number" step="0.01" value="${a.ref}"><button class="btn w" onclick="admL('ref',{amount:v('rfa')})">Saqlash</button></div>

function svcEdit(id,pl){let x={platform:pl,name:"",descr:"",price:"",pack:100,minq:100,icon:"play",soon:0};
 if(id){for(const p in S.adm.svcs){const f=S.adm.svcs[p].find(y=>y.id==id);if(f)x=Object.assign({platform:p},f)}}
 const ic={play:"Prasmotr (▶)",heart:"Like (♥)",share:"Ulashish (⤴)",user:"Obunachi (👤)",save:"Saqlash (🔖)"};
 sheet(`<h2>${id?"Xizmatni tahrirlash":"Yangi xizmat"}</h2><span class="fl">Platforma</span><select id="sv_p">${RAIL.map(n=>`<option ${n==x.platform?"selected":""}>${n}</option>`).join("")}</select><span class="fl">Nomi</span><input id="sv_n" maxlength="60" value="${esc(x.name)}" placeholder="Masalan: Video Prasmotr"><span class="fl">Tavsif</span><input id="sv_d" maxlength="100" value="${esc(x.descr)}" placeholder="Qisqa tavsif"><span class="fl">Narxi ($)</span><input id="sv_pr" type="number" step="0.01" value="${x.price}" placeholder="2"><span class="fl">Narx necha dona uchun</span><input id="sv_pk" type="number" value="${x.pack}" placeholder="500"><span class="fl">Minimal miqdor</span><input id="sv_m" type="number" value="${x.minq}" placeholder="500"><span class="fl">Ikonka</span><select id="sv_i">${Object.entries(ic).map(([k,n])=>`<option value="${k}" ${k==x.icon?"selected":""}>${n}</option>`).join("")}</select><label class="fl"><input type="checkbox" id="sv_s" ${x.soon?"checked":""} style="width:auto;margin-right:6px">Tez kunda (hozircha yopiq)</label><button class="btn" style="width:100%;margin-top:10px" onclick="svcSave(${id||0})">Saqlash</button>`)}
async function svcSave(id){const g=i=>$("#"+i);await admL("svc_save",{id,platform:g("sv_p").value,name:g("sv_n").value.trim(),descr:g("sv_d").value.trim(),price:g("sv_pr").value,pack:g("sv_pk").value,minq:g("sv_m").value,icon:g("sv_i").value,soon:g("sv_s").checked},"Xizmat saqlandi ✓");closeSheet()}
const NAV=[["boost",'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',"Boost"],["tasks",'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 12l3 3 6-7"/>',"Vazifalar"],["profile",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',"Profil"]];
function render(){
 $("#app").innerHTML={boost,tasks,profile,admin,uied,topup,users,uprof,paid}[S.tab]();
 let n=document.querySelector("nav");if(!n){n=document.createElement("nav");document.body.appendChild(n)}
 const act=(S.tab=="admin"||S.tab=="uied"||S.tab=="users"||S.tab=="uprof"||S.tab=="paid")?"profile":S.tab=="topup"?(S.prev||"boost"):S.tab;
 n.innerHTML=NAV.slice().sort((a,b)=>ordOf("nav_"+a[0])-ordOf("nav_"+b[0])).map(t=>`<button data-k="nav_${t[0]}" class="${act==t[0]?"on":""}" onclick="S.tab='${t[0]}';S.plat=null;render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${t[1]}</svg>${L("nav_"+t[0],t[2])}</button>`).join("");
 applyUI()}
setInterval(()=>{const n=Date.now();if(S.tab=="tasks"&&Object.values(CD).some(e=>e>n-1100))render()},1000);
setInterval(()=>{if(S.tab=="tasks"&&S.tasks.some(t=>t.daily>0&&t.cnt>=t.daily)){if(Date.now()>=S.resetAt)load();else render()}},30000);
$("#app").innerHTML="<p style='padding:60px 0;text-align:center;font-weight:600'>Yuklanmoqda…</p>";
load().catch(()=>{$("#app").innerHTML="<p style='padding:60px 20px;text-align:center;font-weight:600'>Ilovani Telegramdagi @"+BOT+" boti orqali oching</p>"});
</script></body></html>
